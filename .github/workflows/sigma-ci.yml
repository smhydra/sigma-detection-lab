name: Sigma Detection Engineering CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-convert:
    name: Rule Validation & SIEM Conversion Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sigma plugin install elasticsearch kusto

      - name: Validate Sigma Rules Schema & Metadata
        run: |
          python tools/validate_rules.py

      - name: pySigma Specification Check
        run: |
          sigma check rules/

      - name: Test SIEM Conversions (Splunk, Elastic, Kusto)
        run: |
          python tools/convert_rules.py

      - name: Generate MITRE ATT&CK Matrix Report
        run: |
          python tools/generate_mitre_matrix.py
