title: Scheduled Task Creation via Schtasks
id: d7610481-410a-4819-b219-9014ef980556
status: experimental
description: Detects schtasks.exe creating new scheduled tasks (/create) to establish persistent binary execution or execute commands at logon/boot.
author: Sigma Detection Lab
date: 2026-10-04
modified: 2026-10-04
references:
    - https://attack.mitre.org/techniques/T1053/005/
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains:
            - '/create'
            - '-create'
    condition: selection
falsepositives:
    - Enterprise software maintenance, updater routines, and administrative scripts.
level: medium
