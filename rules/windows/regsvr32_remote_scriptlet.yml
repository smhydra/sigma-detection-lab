title: Regsvr32 Remote Scriptlet Invocation
id: 5b2606f4-d299-45b2-b6a3-52897a40b2b9
status: experimental
description: Detects regsvr32 command lines referencing remote scriptlet URLs.
author: Sigma GitHub Lab
date: 2026-10-04
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\regsvr32.exe'
        CommandLine|contains:
            - 'scrobj.dll'
            - 'http://'
            - 'https://'
    condition: selection
falsepositives:
    - Review the full command line to confirm that a remote scriptlet is being invoked; URL strings alone may be benign.
level: high
