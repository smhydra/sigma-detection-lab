title: PowerShell Ingress File Download Cradle
id: 4a2b9183-5091-4c48-8e6d-74d3209581fa
status: experimental
description: Detects PowerShell command line invoking WebClient, DownloadFile, DownloadString, or Invoke-WebRequest to retrieve remote files or payloads.
author: Sigma Detection Lab
date: 2026-10-04
modified: 2026-10-04
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1105/
    - https://github.com/redcanaryco/atomic-red-team
tags:
    - attack.execution
    - attack.t1059.001
    - attack.command_and_control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Net.WebClient'
            - 'DownloadFile('
            - 'DownloadString('
            - 'Invoke-WebRequest'
            - 'iwr '
            - 'curl '
            - 'wget '
    condition: selection
falsepositives:
    - Legitimate IT automation scripts downloading software updates or remote modules.
    - Tune by excluding trusted internal domains or signed administrative tools.
level: high
