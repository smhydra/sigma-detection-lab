title: Certutil Used for File Decoding or Remote URL Retrieval
id: e0228282-1658-4d29-a5b5-bb77f38e7618
status: experimental
description: Detects Certutil process invocation using -decode or -urlcache parameters to download remote files or decode base64/hex payload files, leveraging LOLBin techniques.
author: Sigma Detection Lab
date: 2026-10-04
modified: 2026-10-04
references:
    - https://attack.mitre.org/techniques/T1105/
    - https://attack.mitre.org/techniques/T1140/
    - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
tags:
    - attack.command_and_control
    - attack.t1105
    - attack.defense_evasion
    - attack.t1140
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\certutil.exe'
        CommandLine|contains:
            - '-decode'
            - '-urlcache'
            - '/decode'
            - '/urlcache'
    condition: selection
falsepositives:
    - Legitimate PKI certificate maintenance procedures.
    - Inspect file paths and network connections associated with certutil.exe.
level: high
