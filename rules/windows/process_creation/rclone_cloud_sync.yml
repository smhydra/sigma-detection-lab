title: Rclone Exfiltration Command Execution
id: 7120a112-70b9-43a9-9233-0d5b5123984b
status: experimental
description: Detects execution of Rclone cloud synchronization utility with copy, sync, or move command parameters, commonly used by ransomware affiliates for data exfiltration.
author: Sigma Detection Lab
date: 2026-10-04
modified: 2026-10-04
references:
    - https://attack.mitre.org/techniques/T1567/002/
    - https://rclone.org/
tags:
    - attack.exfiltration
    - attack.t1567.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\rclone.exe'
            - '\rclone-v*.exe'
        CommandLine|contains:
            - ' copy '
            - ' sync '
            - ' move '
            - ' config '
    condition: selection
falsepositives:
    - Approved cloud backup agents utilizing Rclone.
level: high
