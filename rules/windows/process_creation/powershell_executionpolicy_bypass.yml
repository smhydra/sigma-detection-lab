title: PowerShell Execution Policy Bypass Flag
id: c8618e47-e21d-4467-8cfb-6f8ef19b788a
status: experimental
description: Detects PowerShell process execution with command-line arguments designed to bypass local execution policies (-ExecutionPolicy Bypass, -ep bypass, -unrestricted).
author: Sigma Detection Lab
date: 2026-10-04
modified: 2026-10-04
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1562/001/
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense_evasion
    - attack.t1562.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - ' -ExecutionPolicy Bypass'
            - ' -executionpolicy bypass'
            - ' -ep bypass'
            - ' -ep Unrestricted'
            - ' -ExecutionPolicy Unrestricted'
    condition: selection
falsepositives:
    - Legitimate software installers and administrative maintenance scripts.
    - Inspect parent process hierarchy and user privilege level.
level: medium
