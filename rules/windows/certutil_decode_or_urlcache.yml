title: Certutil Used for File Decoding or URL Retrieval
id: e0228282-1658-4d29-a5b5-bb77f38e7618
status: experimental
description: Detects certutil command lines containing decoding or URL-cache options often associated with staging.
author: Sigma GitHub Lab
date: 2026-10-04
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\certutil.exe'
        CommandLine|contains:
            - '-decode'
            - '-urlcache'
    condition: selection
falsepositives:
    - Certutil has legitimate certificate-management uses. Validate arguments, output path, and downloaded file.
level: medium
