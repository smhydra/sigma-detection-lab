title: Whoami Privilege and Group Enumeration
id: fe0f4b99-5b9e-47d0-a583-42b89ff88beb
status: experimental
description: Detects whoami commands requesting privilege or group information.
author: Sigma GitHub Lab
date: 2026-10-04
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\whoami.exe'
        CommandLine|contains:
            - '/priv'
            - '/groups'
            - '/all'
    condition: selection
falsepositives:
    - Routine troubleshooting and inventory can match. Increase confidence when followed by suspicious execution or lateral movement.
level: low
